<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
</head>

<body>
    <div id="container">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
    </div>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        #container {
            width: 100%;
            display: flex;
            justify-content: space-around;
        }

        .child {
            width: 31%;
            height: 199px;
            background-color: blue;
            color: white;
        }
    </style>
</body>

</html>
